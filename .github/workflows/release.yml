name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Run npm publish in dry-run mode"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Build web
        run: pnpm web:build

      - name: CLI smoke test
        run: pnpm --filter @audiencemd/cli smoke

  publish:
    name: Publish npm packages
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate requested version
        run: |
          node -e "const v=process.env.RELEASE_VERSION; if(!/^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z.-]+)?$/.test(v)){throw new Error('Invalid release version: '+v)}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Select packages for requested version
        run: |
          node <<'NODE' > /tmp/release-packages
          const fs = require('node:fs');
          const packages = [
            ['@audiencemd/parser', 'packages/parser/package.json'],
            ['@audiencemd/validator', 'packages/validator/package.json'],
            ['@audiencemd/cli', 'apps/cli/package.json'],
          ];
          const targetVersion = process.env.RELEASE_VERSION;
          for (const [name, manifestPath] of packages) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.version === targetVersion) console.log(name);
          }
          NODE
          if [ ! -s /tmp/release-packages ]; then
            echo "No packages have version ${RELEASE_VERSION}."
            exit 1
          fi
          echo "Selected packages:"
          cat /tmp/release-packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Pack packages (dry run)
        run: |
          while IFS= read -r package; do
            pnpm --filter "$package" exec npm pack --dry-run
          done < /tmp/release-packages

      - name: Publish packages (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          while IFS= read -r package; do
            pnpm --filter "$package" publish --dry-run --access public --no-git-checks
          done < /tmp/release-packages

      - name: Publish packages with npm Trusted Publishing
        if: ${{ !inputs.dry_run }}
        run: |
          while IFS= read -r package; do
            if npm view "${package}@${RELEASE_VERSION}" version > /dev/null 2>&1; then
              echo "${package}@${RELEASE_VERSION} is already published; skipping."
            else
              pnpm --filter "$package" publish --provenance --access public --no-git-checks
            fi
          done < /tmp/release-packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
